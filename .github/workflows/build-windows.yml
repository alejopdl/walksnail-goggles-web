name: Build Windows

# Builds the standalone Windows .exe on a real Windows runner (PyInstaller
# cannot cross-compile from macOS/Linux). Produces a downloadable artifact and,
# when a GitHub Release is published, attaches the zip to that release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: poc/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"
          pip install pyinstaller

      - name: Build standalone app
        run: python build.py --clean --zip --no-verify

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (setup.exe)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\wswifistream.iss'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WS-WiFi-Stream-windows
          path: |
            poc/python/dist/WS-WiFi-Stream-win-*.zip
            poc/python/dist/WS-WiFi-Stream-win-setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/WS-WiFi-Stream-win-*.zip \
            dist/WS-WiFi-Stream-win-setup.exe --clobber
